name: Source Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CodexQuotaBar ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "CodexQuotaBar ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
